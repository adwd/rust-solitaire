[package]
name = "solitaire-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "WebAssembly browser host for Rust Solitaire"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
solitaire-core.workspace = true
solitaire-egui.workspace = true
eframe.workspace = true
wgpu = { version = "29", default-features = false, features = ["webgpu", "webgl"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"] }

[lints]
workspace = true
