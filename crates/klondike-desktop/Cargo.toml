[package]
name = "klondike-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native desktop host for Rust Solitaire"

[[bin]]
name = "rust-solitaire"
path = "src/main.rs"

[dependencies]
klondike-core.workspace = true
klondike-egui.workspace = true
