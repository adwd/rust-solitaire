[workspace]
members = ["crates/solitaire-core", "crates/solitaire-egui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
solitaire-core = { path = "crates/solitaire-core" }
rand = { version = "=0.9.2", default-features = false, features = ["std"] }
rand_chacha = "=0.9.0"
eframe = { version = "=0.35.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland"] }
proptest = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
